<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--
        TAGS QUE RAVE LEE PARA DETECTAR EL VIDEO Y ABRIR SALA PRIVADA
        Basado en análisis de xHamster y Tokyvideo que SÍ funcionan con Rave.
        1. og:type = "video.movie" — le dice a Rave que esta página ES un video
        2. og:video = URL directa — Rave la usa para reproducir en sala
        3. <link rel="preload"> del video — xHamster lo usa, Rave lo detecta
        4. <video> tag nativo visible sin JS — fallback y detección directa
        Todo se inyecta desde la URL: ?titulo=...&url=...
    -->

    <!-- Open Graph — estructura EXACTA de xHamster -->
    <meta property="og:site_name"    content="D y A">
    <meta property="og:type"         content="video.movie" id="ogType">
    <meta property="og:title"        content="D y A ❤"    id="ogTitle">
    <meta property="og:description"  content="Sala privada D y A">
    <meta property="og:image"        content="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=640&q=80" id="ogImage">
    <meta property="og:url"          content=""            id="ogUrl">
    <meta property="og:video"        content=""            id="ogVideo">
    <meta property="og:video:url"    content=""            id="ogVideoUrl">
    <meta property="og:video:secure_url" content=""       id="ogVideoSecure">
    <meta property="og:video:type"   content="video/mp4"  id="ogVideoType">
    <meta property="og:video:width"  content="1280">
    <meta property="og:video:height" content="720">
    <meta name="twitter:card"        content="player">
    <meta name="twitter:player"      content=""           id="twPlayer">

    <!-- Schema VideoObject — estructura EXACTA de Tokyvideo -->
    <script type="application/ld+json" id="videoSchema">
    [{
        "@type":        "VideoObject",
        "@context":     "http://schema.org",
        "name":         "D y A",
        "description":  "D y A ❤",
        "contentUrl":   "",
        "embedUrl":     "",
        "thumbnailUrl": "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=640&q=80",
        "url":          "",
        "uploadDate":   "2024-01-01",
        "isFamilyFriendly": true,
        "videoQuality": "HD"
    }]
    </script>

    <!-- Preload del video — técnica de xHamster, Rave la detecta en el head -->
    <link rel="preload" id="videoPreload" as="fetch" crossorigin="true" href="">

    <title id="pageTitle">D y A ❤</title>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --fondo:   #09070f;
            --tarjeta: #14111c;
            --oro:     #d4a373;
            --dorado:  #f3e9dc;
            --vino:    #581825;
            --texto:   #e0dbec;
            --sub:     #a49cb3;
        }
        html, body {
            background: var(--fondo); color: var(--texto);
            font-family: 'Montserrat', system-ui, sans-serif;
            min-height: 100vh;
        }
        /* Cabecera mínima */
        .top-bar {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 18px;
            border-bottom: 1px solid rgba(212,163,115,0.12);
            background: var(--tarjeta);
        }
        .back-btn {
            color: var(--sub); text-decoration: none; font-size: 0.88rem;
            border: 1px solid rgba(212,163,115,0.3); padding: 6px 14px;
            border-radius: 6px; transition: all 0.2s;
        }
        .back-btn:hover { color: var(--oro); border-color: var(--oro); }
        .brand {
            font-family: Georgia, serif; color: var(--oro);
            font-size: 1.15rem; text-decoration: none;
        }

        /* Título del video */
        .video-title {
            font-family: Georgia, serif; font-size: 1.35rem;
            color: var(--dorado); padding: 16px 18px 8px;
        }

        /* Contenedor del video */
        .player-wrap {
            background: #000; width: 100%;
            aspect-ratio: 16/9; position: relative;
        }

        /*
            VIDEO TAG NATIVO — sin JavaScript, sin librerías.
            Visible desde el primer instante que Rave carga la página.
            El src se pone como atributo directo en el tag vía JS al inicio.
            Rave detecta este elemento y ofrece la sala privada.
        */
        #mainVideo {
            width: 100%; height: 100%;
            display: block; background: #000;
        }

        /* Panel inferior */
        .info-panel {
            padding: 14px 18px;
            background: var(--tarjeta);
            border-top: 1px solid rgba(212,163,115,0.12);
        }
        .rave-tip {
            font-size: 0.78rem; color: #7c3aed;
            margin-bottom: 12px; font-style: italic;
        }
        .btn-rave {
            display: inline-flex; align-items: center; gap: 8px;
            background: linear-gradient(135deg,#1a0a2e,#2d1458);
            border: 1px solid #7c3aed; color: #c4b5fd;
            padding: 10px 20px; border-radius: 8px;
            cursor: pointer; font-size: 0.9rem; font-weight: 700;
            transition: all 0.3s; text-decoration: none;
        }
        .btn-rave:hover {
            background: linear-gradient(135deg,#2d1458,#4c1d95);
            box-shadow: 0 0 16px rgba(124,58,237,0.5);
        }
        .err-msg {
            text-align: center; padding: 60px 20px;
            color: var(--sub); font-style: italic;
        }
        .err-msg a { color: var(--oro); }
    </style>
</head>
<body>

<div class="top-bar">
    <a class="back-btn" id="backBtn" href="/">← Volver</a>
    <a class="brand" href="/">D y A ❤</a>
</div>

<div id="pageContent">
    <div class="video-title" id="videoTitle">Cargando...</div>

    <div class="player-wrap">
        <!--
            VIDEO NATIVO — src se asigna directamente con JS.
            No depende de Video.js ni de ninguna librería externa.
            Rave lo detecta al escanear el DOM de la página.
        -->
        <video
            id="mainVideo"
            controls
            playsinline
            preload="auto"
            crossorigin="anonymous"
            poster="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=640&q=80"
        >
            Tu navegador no soporta video HTML5.
        </video>
    </div>

    <div class="info-panel">
        <p class="rave-tip">💡 Abre esta página desde Rave app — detectará el video automáticamente y ofrecerá sala privada</p>
        <a class="btn-rave" id="raveBtn" href="#" target="_blank">🎬 Compartir URL para Rave</a>
    </div>
</div>

<div class="err-msg" id="errMsg" style="display:none;">
    No se encontró el video. <a href="/">← Volver al catálogo</a>
</div>

<script>
(function() {
    /* ===========================================================
       Lee los parámetros de la URL y configura TODO antes de que
       el navegador termine de cargar — Rave escanea en este momento.
    =========================================================== */
    var params  = new URLSearchParams(window.location.search);
    var titulo  = decodeURIComponent(params.get('titulo') || '');
    var url     = decodeURIComponent(params.get('url')    || '');
    var back    = params.get('back') || '/';
    var isM3u8  = url.indexOf('.m3u8') !== -1;
    var mime    = isM3u8 ? 'application/x-mpegURL' : 'video/mp4';
    var pageUrl = window.location.href;

    /* Sin URL — mostrar error */
    if (!url) {
        document.getElementById('pageContent').style.display = 'none';
        document.getElementById('errMsg').style.display = 'block';
        return;
    }

    /* Título y botón volver */
    document.getElementById('videoTitle').textContent  = titulo;
    document.getElementById('pageTitle').textContent   = titulo + ' — D y A ❤';
    document.getElementById('backBtn').href            = back;

    /* ===========================================================
       ACTUALIZAR TODOS LOS META TAGS DEL HEAD
       Rave los lee al cargar la página para decidir si ofrece sala.
    =========================================================== */
    document.getElementById('ogTitle').setAttribute('content',       titulo);
    document.getElementById('ogUrl').setAttribute('content',         pageUrl);
    document.getElementById('ogVideo').setAttribute('content',       url);
    document.getElementById('ogVideoUrl').setAttribute('content',    url);
    document.getElementById('ogVideoSecure').setAttribute('content', url);
    document.getElementById('ogVideoType').setAttribute('content',   mime);
    document.getElementById('twPlayer').setAttribute('content',      pageUrl);

    /* Preload del video en el head — técnica de xHamster */
    document.getElementById('videoPreload').setAttribute('href', url);

    /* Schema VideoObject — estructura de Tokyvideo */
    var schema = [{
        "@type":        "VideoObject",
        "@context":     "http://schema.org",
        "name":         titulo,
        "description":  titulo + " — D y A ❤",
        "contentUrl":   url,
        "embedUrl":     url,
        "thumbnailUrl": "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=640&q=80",
        "url":          pageUrl,
        "uploadDate":   new Date().toISOString().split('T')[0],
        "isFamilyFriendly": true,
        "videoQuality": "HD"
    }];
    document.getElementById('videoSchema').textContent = JSON.stringify(schema);

    /* ===========================================================
       VIDEO TAG NATIVO — asignar src directamente.
       Funciona sin Video.js. Rave lo detecta en el DOM.
       Para .m3u8 intentamos hls.js si está disponible.
    =========================================================== */
    var video = document.getElementById('mainVideo');

    if (isM3u8) {
        /* Intentar hls.js para m3u8 */
        var hlsScript = document.createElement('script');
        hlsScript.src = 'https://cdn.jsdelivr.net/npm/hls.js@latest';
        hlsScript.onload = function() {
            if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                var hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                /* Safari soporta HLS nativo */
                video.src = url;
            }
        };
        document.head.appendChild(hlsScript);
    } else {
        /* mp4 directo — soporte nativo universal */
        video.src = url;
    }

    /* Botón compartir URL para Rave */
    var raveBtn = document.getElementById('raveBtn');
    raveBtn.href = pageUrl;
    raveBtn.onclick = function(e) {
        e.preventDefault();
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(pageUrl).then(function() {
                raveBtn.textContent = '✓ URL copiada — pégala en Rave';
                setTimeout(function() { raveBtn.textContent = '🎬 Compartir URL para Rave'; }, 3000);
            });
        } else {
            prompt('Copia esta URL y pégala en Rave:', pageUrl);
        }
    };
})();
</script>

</body>
</html>
